name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "favicon.svg"
      - "css/**"
      - "js/**"
      - "fonts/**"
      - "data/**"
      - "content/**"
      - "scripts/**"
      - "photographer/**"
      - "aesthetic/**"
      - "28mm/**"
      - "meaning/**"
      - ".nojekyll"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # content/ is the source of truth; pages are rebuilt so a commit that only touched content/ still deploys correctly.
      - name: Build pages
        run: |
          python3 scripts/ingest.py --self-test
          python3 scripts/ingest.py --from-content

      - name: Collect site
        run: |
          rm -rf _site
          mkdir -p _site
          cp ./*.html favicon.svg .nojekyll _site/
          for dir in css js fonts data photographer aesthetic 28mm meaning; do
            if [ -d "$dir" ]; then cp -a "$dir" _site/; fi
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
